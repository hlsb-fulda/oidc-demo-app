default:
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - /root/.cache/.uv

  image: ghcr.io/astral-sh/uv:0.13.4-python3.9-alpine@sha256:6b71818679bb7e84004255acea074a67e8e1ecbd0763c27cb72f6c01669d6e3e

  before_script:
    - python --version ; pip --version ; uv --version
    - uv sync --frozen --no-cache

  after_script:
    - uv cache prune --ci

check:
  script:
    - uv run ruff check
    - uv run ruff format --check

