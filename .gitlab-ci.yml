default:
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - /root/.cache/.uv

  image: ghcr.io/astral-sh/uv:0.9.5-python3.9-alpine@sha256:edd5324bbc5193943a129968921fbc49e2a635bb9447711f3ea9c44f5d15f877

  before_script:
    - python --version ; pip --version ; uv --version
    - uv sync --frozen --no-cache

  after_script:
    - uv cache prune --ci

check:
  script:
    - uv run ruff check
    - uv run ruff format --check

