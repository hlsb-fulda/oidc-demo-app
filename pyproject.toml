[project]
name = "oidc-demo-app"
version = "0.1.0"
description = "A OIDC Demo Resource Server"

readme = "README.md"

authors = [
    { name = "Dustin Frisch", email = "dustin.frisch@hs-fulda.de" }
]

requires-python = ">=3.11"

dependencies = [
    "click>=8.2.1",
    "starlette>=0.47.2",
    "starsessions>=2.1.0",
    "authlib>=1.7.0",
    "joserfc>=1.2.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.29.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.4",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[project.scripts]
oidc-demo-app = "oidc_demo_app.__main__:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

