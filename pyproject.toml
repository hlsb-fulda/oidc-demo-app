[project]
name = "oidc-demo-app"
version = "0.1.0"
description = "A OIDC Demo Resource Server"

readme = "README.md"

authors = [
    { name = "Dustin Frisch", email = "dustin.frisch@hs-fulda.de" }
]

requires-python = ">=3.11"

dependencies = [
    "click>=8.3.3",
    "fastapi>=0.110.0",
    "starlette-sessions>=0.3.0",
    "authlib>=1.7.2",
    "starlette>=1.0.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.29.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[project.scripts]
oidc-demo-app = "oidc_demo_app:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

